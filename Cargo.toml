[package]
name = "tross"
version = "0.1.0"
edition = "2024"
description = "Read API for public LinkedIn member profiles"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
lru = "0.16"
rand = "0.9"
redis = { version = "1.0", features = ["aio", "tokio-comp", "script"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
reqwest_cookie_store = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "timeout", "limit", "sensitive-headers", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "parser"
harness = false

[profile.release]
lto = "thin"
strip = true
